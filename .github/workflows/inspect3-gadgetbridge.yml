# Fourth and last inspection: the exact coordinator flags, base classes and dashboard checks
# needed to store steps / heart rate / sleep so the dashboard and "sync" button work.
# Save as .github/workflows/inspect4-gadgetbridge.yml, then Actions -> "Inspect Gadgetbridge storage code 4" -> Run workflow.
name: Inspect Gadgetbridge storage code 4

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get Gadgetbridge source
        run: git clone --depth 1 https://codeberg.org/Freeyourgadget/Gadgetbridge.git

      - name: Collect excerpts
        working-directory: Gadgetbridge
        run: |
          set +e   # a missing file must not abort the whole collection
          OUT="$GITHUB_WORKSPACE/gb_inspect4.txt"
          J=app/src/main/java/nodomain/freeyourgadget/gadgetbridge
          GEN=$(find . -name GBDaoGenerator.java | head -1)
          show() {
            if [ -n "$1" ] && [ -f "$1" ]; then
              echo "--- $1 ($(wc -l < "$1") lines)"; head -n "${2:-300}" "$1"
            else
              echo "--- (file not found: $1)"
            fi
            return 0
          }
          sec() { echo; echo "=================== $1 ==================="; }
          {
            sec "DeviceCoordinator: every 'supports...' method"
            grep -n -o -E 'boolean supports[A-Za-z0-9]+\(' $J/devices/DeviceCoordinator.java | sort -t: -k1 -n
            sec "Why the sync button says 'do not support data sync'"
            grep -rn -B12 -A4 'do not support data sync' app/src/main/java | head -60
            sec "AbstractYawellRingCoordinator"
            show "$(find $J -name AbstractYawellRingCoordinator.java | head -1)" 260
            sec "AbstractDeviceCoordinator: default getSampleProvider and the fetch-related defaults"
            grep -n -E 'getSampleProvider|supportsActivityTracking|supportsDataFetching|supportsActivityDataFetching|supportsHeartRateMeasurement|supportsSleepMeasurement|supportsStepCounting' $J/impl/*.java $J/devices/AbstractDeviceCoordinator.java 2>/dev/null | head -30
            sec "AbstractActivitySample (what an entity base class must implement)"
            show "$J/entities/AbstractActivitySample.java" 200
            sec "SampleProvider interface"
            show "$J/devices/SampleProvider.java" 140
            sec "ColmiHeartRateSampleProvider and AbstractHeartRateSample"
            show "$(find $J -name ColmiHeartRateSampleProvider.java | head -1)" 110
            show "$J/entities/AbstractHeartRateSample.java" 60
            sec "GBDaoGenerator: how sampleProvidersToGenerate is used"
            grep -n 'sampleProvidersToGenerate' "$GEN" | head -8
            sec "Which files test the coordinator flags (dashboard and charts)"
            grep -rln -E 'supportsActivityTracking|supportsHeartRateMeasurement|supportsSleepMeasurement|supportsStepCounting' app/src/main/java | sed "s#app/src/main/java/nodomain/freeyourgadget/gadgetbridge/##" | head -40
            sec "Lines using those flags inside dashboard/widget code"
            grep -rn -E 'supportsActivityTracking|supportsHeartRateMeasurement|supportsSleepMeasurement|supportsStepCounting' $J/activities/dashboard $J/activities/charts $J/activities/ControlCenterv2.java 2>/dev/null | head -30
            sec "Where the dashboard decides what widgets to show"
            find $J -ipath '*dashboard*' -name '*.java' | head -30
          } > "$OUT" 2>&1
          wc -c "$OUT"
          exit 0

      - name: Upload excerpts
        uses: actions/upload-artifact@v4
        with:
          name: gb-inspect4
          path: gb_inspect4.txt
