# Collects the parts of Gadgetbridge's source that show how a modern device stores steps / heart rate / sleep
# so the dashboard fills in. It builds nothing and produces one text file to upload.
# Save as .github/workflows/inspect2-gadgetbridge.yml, then Actions -> "Inspect Gadgetbridge storage code" -> Run workflow.
name: Inspect Gadgetbridge storage code

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get Gadgetbridge source
        run: git clone --depth 1 https://codeberg.org/Freeyourgadget/Gadgetbridge.git

      - name: Collect excerpts
        working-directory: Gadgetbridge
        run: |
          OUT="$GITHUB_WORKSPACE/gb_inspect2.txt"
          J=app/src/main/java/nodomain/freeyourgadget/gadgetbridge
          GEN=$(find . -name GBDaoGenerator.java | head -1)
          sec() { echo; echo "=================== $1 ==================="; }
          {
            sec "commit"; git log -1 --format='%H %ad %s'
            sec "database schema version"; grep -n -E 'new Schema\(|Schema schema' "$GEN" | head
            sec "GBDaoGenerator: calls that register entities (first 80 add* calls)"
            grep -n -E '^\s+add[A-Za-z0-9]+\(schema' "$GEN" | head -80
            sec "GBDaoGenerator: shared helper methods"
            grep -n -E 'private static .*(addCommon|addHeartRate|addSteps|addTemperature|addSpo2|addStress|addBattery|addActivity|addTimed)[A-Za-z0-9]*\(' "$GEN" | head -30
            sec "Colmi: files"; find . -ipath '*colmi*' -name '*.java' | head -40
            sec "GBDaoGenerator: Colmi entity block"
            awk '/private static void addColmi|private static Entity addColmi/{p=1} p{print NR": "$0} p&&/^    }$/{exit}' "$GEN" | head -120
            sec "Colmi coordinator"
            f=$(find $J -ipath '*devices/colmi*' -name '*Coordinator.java' | head -1); echo "--- $f"; cat "$f" | head -400
            sec "Colmi sample providers (heart rate, activity, sleep if present)"
            for f in $(find $J -ipath '*devices/colmi/samples*' -name '*SampleProvider.java' | head -4); do echo "--- $f"; cat "$f" | head -160; done
            sec "Colmi support class: how data is saved"
            f=$(find $J -ipath '*service/devices/colmi*' -name '*Support.java' | head -1); echo "--- $f"
            grep -n -E 'DBHandler|GBApplication.acquireDB|getSampleProvider|insertOrReplace|addSamples|Sample\(' "$f" | head -50
            sec "DeviceCoordinator: supports* and sample-provider declarations"
            f=$(find $J/devices -maxdepth 1 -name DeviceCoordinator.java); echo "--- $f"
            grep -n -E 'supports(Steps|StepCounting|HeartRate|ActivityData|ActivityTracking|Sleep|Spo2|Temperature|Stress|Realtime|Hrv|Battery)[A-Za-z]*\(|getSampleProvider|getTimeSampleProvider|getActivitySampleProvider|getDeviceSpecificSettings|DeviceKind' "$f" | head -60
            sec "Dashboard: how widgets decide to show"
            grep -rn -E 'supportsStepCounting|supportsHeartRateMeasurement|supportsActivityTracking|supportsSleepMeasurement' $J/activities/dashboard 2>/dev/null | head -20
            sec "AbstractSampleProvider / AbstractTimeSampleProvider headers"
            for n in AbstractSampleProvider AbstractTimeSampleProvider; do f=$(find $J -name $n.java | head -1); echo "--- $f"; grep -n -E '^\s*(public|protected|abstract)' "$f" | head -40; done
          } > "$OUT" 2>&1
          wc -c "$OUT"

      - name: Upload excerpts
        uses: actions/upload-artifact@v4
        with:
          name: gb-inspect2
          path: gb_inspect2.txt
